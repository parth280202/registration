<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player 2 Request</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0b1a;
            color: #00ffcc;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            background-image: radial-gradient(circle, #1a1a2e 10%, #000 90%);
        }

        /* The Main Screen */
        #gameboy-screen {
            background: #0f0f1a;
            border: 4px solid #ff0055;
            border-radius: 15px;
            padding: 20px;
            width: 85%;
            max-width: 500px;
            box-shadow: 0px 0px 20px rgba(255, 0, 85, 0.6), inset 0px 0px 20px rgba(0, 255, 204, 0.1);
            min-height: 350px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: pulse-border 3s infinite alternate;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0px 0px 20px rgba(255, 0, 85, 0.4), inset 0px 0px 10px rgba(0, 255, 204, 0.1); }
            100% { box-shadow: 0px 0px 35px rgba(255, 0, 85, 0.8), inset 0px 0px 25px rgba(0, 255, 204, 0.2); }
        }

        /* CRT Scanline Effect */
        #gameboy-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            border-radius: 10px;
        }

        .content-wrapper { z-index: 10; position: relative; width: 100%; }

        /* Custom scrollbar for desktop */
        #gameboy-screen::-webkit-scrollbar { width: 6px; }
        #gameboy-screen::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 5px; }

        .hidden { display: none !important; }

        /* Smooth fade in for scene changes */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pixel art style Gift with heartbeat */
        .envelope {
            font-size: 70px;
            cursor: pointer;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0px 0px 15px #ff0055);
            margin: 20px 0;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* Typewriter & Text */
        #message {
            font-size: 11px;
            line-height: 2.2;
            text-align: left;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 1px 1px 0px #ff0055;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap; 
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            background: #0f0f1a;
            color: #ff0055;
            border: 3px solid #ff0055;
            padding: 12px 15px;
            cursor: pointer;
            font-size: 10px;
            transition: 0.2s;
            text-transform: uppercase;
            z-index: 100;
        }

        .btn:active { transform: scale(0.95); }

        #btn-yes:hover {
            background: #ff0055;
            color: #0f0f1a;
            box-shadow: 0px 0px 15px #ff0055;
        }

        #btn-no { transition: top 0.1s, left 0.1s; }

        /* RPG Form Styling */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            display: block;
            color: #ff0055;
            font-size: 9px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px #000;
            line-height: 1.4;
        }

        .retro-input {
            font-family: 'Press Start 2P', cursive;
            background: rgba(0, 255, 204, 0.05);
            color: #00ffcc;
            border: 2px dashed #00ffcc;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 9px;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            appearance: none; 
            -webkit-appearance: none;
        }

        .retro-input:focus { border-style: solid; background: rgba(0, 255, 204, 0.1); }

        .blink-text {
            animation: blinker 1s linear infinite;
            color: #ffff00;
        }

        @keyframes blinker { 50% { opacity: 0; } }

        /* Falling Emojis CSS */
        .falling-emoji {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* Party Avatars */
        .party-box {
            display: flex;
            justify-content: space-evenly;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #ffff00;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 9px;
            line-height: 1.8;
            border-radius: 8px;
        }

        /* --- MOBILE MEDIA QUERIES --- */
        @media (max-width: 480px) {
            #gameboy-screen { width: 90%; padding: 15px; border-width: 3px; }
            .envelope { font-size: 55px; margin: 15px 0; }
            #message { font-size: 9px; line-height: 2; }
            .btn { font-size: 9px; padding: 10px 12px; }
            h2 { font-size: 14px !important; }
            h3 { font-size: 11px !important; }
        }
    </style>
</head>
<body>

    <div id="gameboy-screen">
        <div class="content-wrapper">
            
            <!-- Scene 1: Envelope / Gift -->
            <div id="scene-envelope" class="fade-in">
                <p style="font-size: 10px; color: #fff; line-height: 1.8;">* BIRTHDAY LOOT DROP DISCOVERED *</p>
                <div class="envelope" onclick="openLetter()">🎁</div>
                <p class="blink-text" style="font-size: 9px; margin-top: 15px;">TAP TO OPEN</p>
            </div>

            <!-- Scene 2: Typewriter -->
            <div id="scene-letter" class="hidden fade-in">
                <div id="message"></div>
                
                <div id="question-scene" class="hidden fade-in">
                    <p style="color: #ff0055; font-size: 10px; line-height: 1.6; margin-top: 15px; text-shadow: 1px 1px #000;">WILL YOU GO ON A DATE WITH ME?</p>
                    <div class="btn-container">
                        <button id="btn-yes" class="btn" onclick="clickYes()">[ HELL YES ]</button>
                        <!-- Added ontouchstart for mobile dodging -->
                        <button id="btn-no" class="btn" onmouseover="dodgeButton(event)" ontouchstart="dodgeButton(event)" onclick="clickNo()">[ NO ]</button>
                    </div>
                </div>
            </div>

            <!-- Scene 3: The Planning Phase -->
            <div id="scene-planning" class="hidden fade-in">
                <h3 style="color: #fff; font-size: 12px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">INVENTORY & STATS</h3>
                
                <div class="form-group">
                    <label>📍 SELECT MISSION MAP:</label>
                    <select id="date-type" class="retro-input">
                        <option value="Late Night Drive">🚗 Late Night Drive (Vibes)</option>
                        <option value="Arcade & Gaming">🕹️ Arcade (Prepare to lose!)</option>
                        <option value="Movie Night">🍿 Movie Night (No talking!)</option>
                        <option value="Coffee & Chat">☕ Coffee & Chat (Cozy)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>HP RECOVERY (FOOD):</label>
                    <select id="food-type" class="retro-input">
                        <option value="Italian">🍕 Italian (Pizza/Pasta)</option>
                        <option value="Asian">🍜 Pan-Asian (Noodles/Sushi)</option>
                        <option value="Street Food">🌮 Street Food & Chaos</option>
                        <option value="Desserts">🍰 Just Desserts & Sugar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>⏰ SELECT SERVER TIME:</label>
                    <input type="datetime-local" id="date-time" class="retro-input">
                </div>

                <div style="text-align: center; margin-top: 25px;">
                    <button class="btn" style="width: 100%; border-color: #00ffcc; color: #00ffcc;" onclick="finishPlanning()">[ LOCK IN CHOICES ]</button>
                </div>
            </div>

            <!-- Scene 4: Saving Loading Screen -->
            <div id="scene-loading" class="hidden fade-in">
                <h2 class="blink-text" style="font-size: 14px;">SAVING PROGRESS...</h2>
                <p style="font-size: 8px; color: #888; margin-top: 15px;">DO NOT TURN OFF THE POWER</p>
            </div>

            <!-- Scene 5: Final Victory Screen -->
            <div id="scene-success" class="hidden fade-in">
                <h2 style="color: #ff0055; margin-bottom: 15px; font-size: 16px;">QUEST ACCEPTED! 🏆</h2>
                
                <!-- Cute Player Avatars -->
                <div class="party-box">
                    <div>
                        <span style="font-size: 18px;">🧑‍💻</span><br>
                        <span style="color: #00ffcc;">P1: PARTH</span>
                    </div>
                    <div>
                        <span style="font-size: 18px;">👸</span><br>
                        <span style="color: #ff0055;">P2: GAURI</span>
                    </div>
                </div>
                
                <div id="mission-log" style="text-align: left; background: rgba(0, 0, 0, 0.6); border: 2px dashed #00ffcc; padding: 15px; font-size: 9px; line-height: 2.2; margin-bottom: 15px;">
                    <!-- Filled via JS -->
                </div>
                
                <p class="blink-text" style="font-size: 9px;">I'll see you soon!</p>
            </div>

        </div>
    </div>

    <script>
        // The newly updated sincere and sweet message
        const textToType = "Hi Gauri,\n\nHappy Belated Birthday!\n\nI figured your special day was fully booked with friends and family, so I waited for things to settle down a bit.\n\nI would really love to take you out on a date and celebrate properly, just the two of us.\n\nSo... ready for Player 2 to join your game?";
        let charIndex = 0;

        function openLetter() {
            document.getElementById('scene-envelope').classList.add('hidden');
            document.getElementById('scene-letter').classList.remove('hidden');
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < textToType.length) {
                let char = textToType.charAt(charIndex);
                if (char === '\n') {
                    document.getElementById("message").innerHTML += "<br>";
                } else {
                    document.getElementById("message").innerHTML += char;
                }
                charIndex++;
                setTimeout(typeWriter, 35); 
            } else {
                setTimeout(() => {
                    document.getElementById('question-scene').classList.remove('hidden');
                }, 600);
            }
        }

        function dodgeButton(e) {
            if (e && e.type === 'touchstart') {
                e.preventDefault(); 
            }
            
            const btn = document.getElementById('btn-no');
            btn.style.position = 'fixed';
            
            const safeWidth = window.innerWidth - btn.offsetWidth - 20;
            const safeHeight = window.innerHeight - btn.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.random() * safeWidth);
            const randomY = Math.max(10, Math.random() * safeHeight);
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function clickNo() {
            alert("⚠️ SYSTEM OVERRIDE: You are destined to click YES.");
        }

        function clickYes() {
            document.getElementById('scene-letter').classList.add('hidden');
            document.getElementById('scene-planning').classList.remove('hidden');
        }

        function startRaining() {
            const emojis = ['💖', '✨', '🎮', '👾', '🎁', '🎉', '🍰'];
            setInterval(() => {
                const drop = document.createElement('div');
                drop.classList.add('falling-emoji');
                drop.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                document.body.appendChild(drop);
                setTimeout(() => { drop.remove(); }, 4500);
            }, 250);
        }

        async function finishPlanning() {
            const type = document.getElementById("date-type").value;
            const food = document.getElementById("food-type").value;
            const timeVal = document.getElementById("date-time").value;
            let timeDisplay = timeVal ? timeVal.replace("T", " at ") : "To Be Determined";

            document.getElementById('scene-planning').classList.add('hidden');
            document.getElementById('scene-loading').classList.remove('hidden');

            try {
                await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        access_key: 'bbd67653-cc36-42ef-9bf4-75ce95191cf2',
                        subject: '🎮 PLAYER 2 ALERT: Gauri Accepted the Quest!',
                        Mission_Type: type,
                        Food_Choice: food,
                        Date_and_Time: timeDisplay,
                    })
                });
            } catch (error) {
                console.log("Email background error, moving to success.");
            }

            setTimeout(() => {
                document.getElementById('scene-loading').classList.add('hidden');
                
                document.getElementById('mission-log').innerHTML = `
                    <span style="color: #ff0055;">> MAP:</span> ${type}<br>
                    <span style="color: #ff0055;">> BUFF:</span> ${food}<br>
                    <span style="color: #ff0055;">> ETA:</span> ${timeDisplay}
                `;
                
                document.getElementById('scene-success').classList.remove('hidden');
                startRaining();
            }, 2000);
        }
    </script>
</body>
</html>
